# SuperMimic-compatible WAM branch. The state/context vectors are filled from
# the resolved environment dimensions by the launcher.
_target_: gear_sonic.trl.modules.wam.StateSpaceWorldModel
_recursive_: false
cfg:
  _target_: gear_sonic.trl.modules.wam.WAMConfig
  # p(3)+root quaternion(wxyz)(4)+root v(3)+root w(3)+q(29)+qd(29).
  state_dim: 71
  action_dim: 29
  # WAM is goal-free. Goal observations stay on the Sonic actor/FSQ path.
  goal_dim: 0
  context_dim: 33
  hidden: [2048, 2048, 2048]
  term_hidden: [128, 128]
  reward_hidden: [128, 128]
  learn_termination: false
  learn_reward: false
  reward_loss_coef: 0.0
  residual_scale: 1.0
  state_type: physical
  reward_mode: analytic
  termination_mode: analytic
