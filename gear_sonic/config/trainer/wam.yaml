defaults:
  - /world_model/wam_critic@critic_config
  - _self_

_target_: gear_sonic.trl.trainer.wam_trainer.WAMTrainer
settings:
  # WAM models only the robot-side observation. Sonic's multimodal goal
  # (G1/teleop/SMPL -> encoder -> FSQ) follows its logged timeline separately.
  # WAM receives one current proprioceptive frame. Sonic's actor keeps its
  # normal actor_obs history separately for the decoder.
  state_observation_keys: [wam_state]
  # Actor-only goal stream. It is replayed for encoder/FSQ BPTT and never
  # passed to the WAM dynamics.
  goal_observation_keys: [tokenizer]
  # SuperMimic ξ = friction, joint-default offsets, and torso CoM offset.
  # It is replayed per timestep and is consumed by WAM, never by FSQ.
  context_observation_keys: [wam_context]
  reference_observation_keys: [wam_reference]
  critic_observation_keys: [critic]
  collect_steps: 1
  motion_resample_frequency: 250
  replay_steps: 1000
  replay_envs: 4096
  window: 8
  horizon: 32
  batch_size: 2048
  policy_batch_size: 4096
  world_updates: 10
  warmup_world_updates: 100
  actor_updates: 1
  critic_epochs: 5
  critic_minibatches: 4
  learning_rate: 0.0002
  learning_rate_decay_iters: 250000
  learning_rate_min_ratio: 0.03
  utd: 0.4
  warmup_steps: 64
  wm_only_iters: 500
  reset_sampling: return
  action_noise: 0.1
  aux_loss_scale: 1.0
  save_interval: 500
  save_replay: false
  compile: false
