defaults:
  - /world_model/wam_critic@critic_config
  - /world_model/wam_reward@reward_config
  - _self_

_target_: gear_sonic.trl.trainer.wam_trainer.WAMTrainer
settings:
  # WAM models only the robot-side observation. Sonic's multimodal goal
  # (G1/teleop/SMPL -> encoder -> FSQ) follows its logged timeline separately.
  # WAM receives one current proprioceptive frame. Sonic's actor keeps its
  # normal actor_obs history separately for the decoder.
  state_observation_keys: [wam_state]
  # Actor-only goal stream. It is replayed for encoder/FSQ BPTT and never
  # passed to the WAM dynamics.
  goal_observation_keys: [tokenizer]
  # Preserve SuperMimic's 33 calibration values, then append complete material,
  # mass, inertia and CoM properties in a versioned simulator layout.
  # ξ is consumed by WAM/critic and never by FSQ.
  complete_context: true
  context_observation_keys: [wam_context]
  reference_observation_keys: [wam_reference]
  # Shared physical critic uses FK tracking features + raw robot future + ξ.
  # Match the G1 goal time grid while all actor modalities share this critic.
  critic_observation_keys: []
  critic_future_frames: ${manager_env.commands.motion.num_future_frames}
  critic_future_dt: ${manager_env.commands.motion.dt_future_ref_frames}
  # Real collection and imagination share SuperMimic's failure criteria.
  # Clip ends / the environment's episode limit remain normal truncations.
  align_real_termination: true
  termination_height: 0.25
  termination_tilt: 0.8
  termination_height_width: 0.02
  termination_tilt_width: 0.04
  # Share the same eight FK-based terms with the real RewardManager.
  align_real_reward: true
  collect_steps: 1
  motion_resample_frequency: 250
  replay_steps: 1000
  replay_envs: 4096
  window: 8
  horizon: 32
  # Real done masks supervise dynamics; actor imagination follows its own
  # soft termination and the immutable reference clip's actual end.
  independent_imagination: true
  batch_size: 2048
  policy_batch_size: 4096
  world_updates: 10
  warmup_world_updates: 100
  actor_updates: 1
  critic_epochs: 5
  critic_minibatches: 4
  learning_rate: 0.0002
  learning_rate_decay_iters: 250000
  learning_rate_min_ratio: 0.03
  utd: 0.4
  warmup_steps: 64
  wm_only_iters: 500
  reset_sampling: return
  action_noise: 0.1
  # Jointly optimize encoder/FSQ/decoder with SuperMimic's summed return.
  actor_return_reduction: sum
  aux_loss_scale: 1.0
  gradient_diagnostics_interval: 100
  save_interval: 500
  save_replay: false
  compile: false
