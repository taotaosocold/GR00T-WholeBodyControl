# Physical WAM reward composition. Weights and shared parameters are filled
# from trainer.reward_config before saving the run configuration.
_target_: gear_sonic.envs.manager_env.mdp.rewards.RewardsCfg

tracking_relative_body_pos:
  _target_: isaaclab.managers.RewardTermCfg
  func: gear_sonic.utils.wam_reward:tracking_reward_term
  weight: 1.0
  params:
    term_name: tracking_relative_body_pos
tracking_relative_body_ori:
  _target_: isaaclab.managers.RewardTermCfg
  func: gear_sonic.utils.wam_reward:tracking_reward_term
  weight: 1.0
  params:
    term_name: tracking_relative_body_ori
tracking_body_linvel:
  _target_: isaaclab.managers.RewardTermCfg
  func: gear_sonic.utils.wam_reward:tracking_reward_term
  weight: 1.0
  params:
    term_name: tracking_body_linvel
tracking_body_angvel:
  _target_: isaaclab.managers.RewardTermCfg
  func: gear_sonic.utils.wam_reward:tracking_reward_term
  weight: 1.0
  params:
    term_name: tracking_body_angvel
tracking_anchor_pos:
  _target_: isaaclab.managers.RewardTermCfg
  func: gear_sonic.utils.wam_reward:tracking_reward_term
  weight: 0.5
  params:
    term_name: tracking_anchor_pos
tracking_anchor_ori:
  _target_: isaaclab.managers.RewardTermCfg
  func: gear_sonic.utils.wam_reward:tracking_reward_term
  weight: 0.5
  params:
    term_name: tracking_anchor_ori
action_rate_l2:
  _target_: isaaclab.managers.RewardTermCfg
  func: gear_sonic.utils.wam_reward:tracking_reward_term
  weight: -0.1
  params:
    term_name: action_rate_l2
joint_limit:
  _target_: isaaclab.managers.RewardTermCfg
  func: gear_sonic.utils.wam_reward:tracking_reward_term
  weight: -2.0
  params:
    term_name: joint_limit
