# Canonical SuperMimic physical state for the differentiable WAM.
# The order is p(3), quat(wxyz)(4), v(3), w(3), q(29), qd(29) = 71.

defaults:
  - ../terms/wam_root_pos_w@_here_
  - ../terms/wam_root_quat_w@_here_
  - ../terms/wam_root_lin_vel_w@_here_
  - ../terms/wam_root_ang_vel_w@_here_
  - ../terms/wam_joint_pos@_here_
  - ../terms/wam_joint_vel@_here_

_target_: gear_sonic.envs.manager_env.mdp.observations.WAMStateCfg
enable_corruption: false
concatenate_terms: true
