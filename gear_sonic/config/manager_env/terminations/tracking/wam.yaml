# Selected automatically by the physical WAM trainer before config is saved.
# Replace the complete Sonic termination group so no strict foot/hand checks
# survive alongside SuperMimic's height/tilt failure rule.
_target_: gear_sonic.envs.manager_env.mdp.terminations.TerminationsCfg

wam_failure:
  _target_: isaaclab.managers.TerminationTermCfg
  func: gear_sonic.utils.wam_termination:supermimic_failure
  params:
    command_name: motion
    height_threshold: 0.25
    tilt_threshold: 0.8

time_out:
  _target_: isaaclab.managers.TerminationTermCfg
  func: gear_sonic.utils.wam_termination:supermimic_time_out
  time_out: true
  params:
    command_name: motion
