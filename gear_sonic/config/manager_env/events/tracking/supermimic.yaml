# Physical WAM's matched SuperMimic domain. PPO keeps its own event group.
_target_: gear_sonic.envs.manager_env.mdp.events.EventCfg

physics_material:
  _target_: isaaclab.managers.EventTermCfg
  func: gear_sonic.utils.wam_domain_randomization:randomize_supermimic_material
  mode: startup
  params:
    asset_cfg:
      _target_: isaaclab.managers.SceneEntityCfg
      name: robot
    friction_range: [0.3, 1.2]

base_com:
  _target_: isaaclab.managers.EventTermCfg
  func: gear_sonic.envs.manager_env.mdp:randomize_rigid_body_com
  mode: startup
  params:
    asset_cfg:
      _target_: isaaclab.managers.SceneEntityCfg
      name: robot
      body_names: torso_link
    com_range:
      x: [-0.025, 0.025]
      y: [-0.05, 0.05]
      z: [-0.05, 0.05]

add_joint_default_pos:
  _target_: isaaclab.managers.EventTermCfg
  func: gear_sonic.utils.wam_domain_randomization:reset_supermimic_joint_offsets
  mode: reset
  params:
    asset_cfg:
      _target_: isaaclab.managers.SceneEntityCfg
      name: robot
    offset_range: [-0.01, 0.01]
